[package]
name = "hydra-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hydra CLI for agent workflows, routing, indexing, sandboxing, and task execution"

[lib]
name = "hydra_cli"
path = "src/lib.rs"

[[bin]]
name = "hydra-cli"
path = "src/main.rs"

[dependencies]
pi = { package = "pi_agent_rust", version = "0.2.0", path = "../../submodules/pi_agent_rust" }
hydra-matrix = { workspace = true }
hydra-sandbox = { workspace = true }
hydra-dag = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
rand = "0.8"
thiserror = "1.0"
tempfile = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
integration-tests = []
