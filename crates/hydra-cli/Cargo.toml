[package]
name = "hydra-cli"
version = "0.1.0"
edition = "2021"
description = "Hydra CLI for agent workflows, routing, indexing, sandboxing, and task execution"
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/Akshay0831/hydra-cli"

[dependencies]
pi = { package = "pi_agent_rust", version = "0.2.0", path = "../../core/pi_agent" }
hydra-matrix = { version = "0.1.0", path = "../hydra-matrix" }
hydra-sandbox = { version = "0.1.0", path = "../hydra-sandbox" }
hydra-dag = { version = "0.1.0", path = "../hydra-dag" }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
rand = "0.8"
thiserror = "1.0"
tempfile = "3.27"

[dev-dependencies]
tempfile = "3.27"

[features]
default = []
integration-tests = []
