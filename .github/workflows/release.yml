name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: hydra-cli-linux-x86_64
            binary_path: target/release/hydra-cli
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: hydra-cli-macos-x86_64
            binary_path: target/release/hydra-cli
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: hydra-cli-macos-arm64
            binary_path: target/release/hydra-cli
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: hydra-cli-windows-x86_64.exe
            binary_path: target/release/hydra-cli.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --bin hydra-cli

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}

  create-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Assets
        run: |
          mkdir -p release-assets
          cp artifacts/hydra-cli-linux-x86_64/hydra-cli release-assets/hydra-cli-linux-x86_64
          cp artifacts/hydra-cli-macos-x86_64/hydra-cli release-assets/hydra-cli-macos-x86_64
          cp artifacts/hydra-cli-macos-arm64/hydra-cli release-assets/hydra-cli-macos-arm64
          cp artifacts/hydra-cli-windows-x86_64.exe/hydra-cli.exe release-assets/hydra-cli-windows-x86_64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
