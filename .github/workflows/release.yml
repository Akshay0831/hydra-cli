name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: hydra-cli-linux-x86_64
            binary_name: hydra-cli
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: hydra-cli-macos-x86_64
            binary_name: hydra-cli
          - target: aarch64-apple-darwin
            os: macos-14
            artifact_name: hydra-cli-macos-arm64
            binary_name: hydra-cli
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: hydra-cli-windows-x86_64
            binary_name: hydra-cli.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --bin hydra-cli --target ${{ matrix.target }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          if-no-files-found: error

  create-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Assets
        run: |
          mkdir -p release-assets
          cp artifacts/hydra-cli-linux-x86_64/hydra-cli release-assets/hydra-cli-linux-x86_64
          cp artifacts/hydra-cli-macos-x86_64/hydra-cli release-assets/hydra-cli-macos-x86_64
          cp artifacts/hydra-cli-macos-arm64/hydra-cli release-assets/hydra-cli-macos-arm64
          cp artifacts/hydra-cli-windows-x86_64/hydra-cli.exe release-assets/hydra-cli-windows-x86_64.exe
          chmod +x release-assets/hydra-cli-linux-x86_64 release-assets/hydra-cli-macos-x86_64 release-assets/hydra-cli-macos-arm64
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
