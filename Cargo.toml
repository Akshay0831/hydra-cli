[workspace]
resolver = "2"
exclude = ["submodules/pi_agent_rust", "submodules/litellm", "submodules/mcp-sdk"]
members = [
    "crates/hydra-matrix",
    "crates/hydra-sandbox",
    "crates/hydra-dag",
    "crates/hydra-cli",
]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4"] }
