[workspace]
resolver = "2"
exclude = ["submodules/pi_agent_rust", "submodules/litellm", "submodules/mcp-sdk"]
members = [
    "crates/hydra-matrix",
    "crates/hydra-sandbox",
    "crates/hydra-dag",
    "crates/hydra-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Akshay0831/hydra-cli"
readme = "README.md"
authors = ["Hydra Contributors"]

[workspace.dependencies]
# Internal workspace crates with centralized versioning
hydra-cli = { version = "0.3.0", path = "crates/hydra-cli" }
hydra-matrix = { version = "0.3.0", path = "crates/hydra-matrix" }
hydra-sandbox = { version = "0.3.0", path = "crates/hydra-sandbox" }
hydra-dag = { version = "0.3.0", path = "crates/hydra-dag" }

# Shared third-party dependencies
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.39", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"
tempfile = "3.27"
